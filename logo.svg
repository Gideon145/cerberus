<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c081a"/>
      <stop offset="100%" stop-color="#06040a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="60" fill="url(#bgGrad)"/>
  <!-- Outer glow ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ef444420" stroke-width="2"/>
  <!-- Three heads (circles) -->
  <circle cx="140" cy="200" r="40" fill="url(#redGrad)" opacity="0.9"/>
  <circle cx="200" cy="140" r="40" fill="url(#amberGrad)" opacity="0.9"/>
  <circle cx="260" cy="200" r="40" fill="url(#purpleGrad)" opacity="0.9"/>
  <!-- Inner dots (eyes) -->
  <circle cx="140" cy="200" r="8" fill="#0c081a"/>
  <circle cx="200" cy="140" r="8" fill="#0c081a"/>
  <circle cx="260" cy="200" r="8" fill="#0c081a"/>
  <!-- Connecting lines between heads -->
  <line x1="172" y1="183" x2="175" y2="163" stroke="#ffffff20" stroke-width="1.5"/>
  <line x1="228" y1="183" x2="225" y2="163" stroke="#ffffff20" stroke-width="1.5"/>
  <line x1="175" y1="210" x2="225" y2="210" stroke="#ffffff20" stroke-width="1.5"/>
  <!-- CERBERUS text -->
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="38" fill="#f0edfa" letter-spacing="8">CERBERUS</text>
  <!-- Subtitle -->
  <text x="200" y="325" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="14" fill="#a78bfa" letter-spacing="4">3-AGENT AUTONOMOUS SECURITY</text>
  <!-- Small Somnia badge -->
  <rect x="120" y="345" width="160" height="24" rx="12" fill="#a78bfa15" stroke="#a78bfa30" stroke-width="1"/>
  <text x="200" y="361" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="10" fill="#a78bfa" letter-spacing="2">SOMNIA AGENTIC L1</text>
</svg>
